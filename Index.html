<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extreme Demon Bracket — 1v1 Showdowns</title>
  <style>
    :root {
      --bg: #080a10;
      --panel: #101522;
      --panel-2: #171e30;
      --line: rgba(148, 163, 184, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --win: #22c55e;
      --gold: #eab308;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.15), transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .title {
      margin: 0;
      font-size: 22px;
      font-weight: 850;
    }

    .subtitle {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    .mode-switch {
      display: flex;
      background: var(--panel);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #061018;
    }

    .round-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    @media (max-width: 720px) {
      .arena {
        grid-template-columns: 1fr;
      }
      .vs-badge {
        text-align: center;
      }
    }

    .vs-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: var(--accent);
      padding: 6px;
    }

    .fighter-card {
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .fighter-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .fighter-thumb {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #05070c;
    }

    .fighter-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .fighter-name {
      margin: 0;
      font-size: 19px;
      font-weight: 850;
    }

    .fighter-meta {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .vote-btn {
      margin-top: auto;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #0284c7);
      color: #051018;
      font-weight: 850;
      font-size: 14px;
      cursor: pointer;
    }

    .champion-banner {
      display: none;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.45);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 22px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .champion-banner.show {
      display: flex;
    }

    .btn-reset {
      background: var(--win);
      color: #051309;
      border: none;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .ranking-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
    }

    .ranking-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .rank-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 8px;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .elo-tag {
      color: var(--gold);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1 class="title">Extreme Demon Bracket</h1>
        <p class="subtitle">1v1 matchups &amp; tournament bracket</p>
      </div>

      <div class="mode-switch">
        <button id="btn-1v1" class="mode-btn active" type="button">1v1 Elo</button>
        <button id="btn-cup" class="mode-btn" type="button">Bracket Cup (8)</button>
      </div>
    </header>

    <div class="round-bar">
      <span id="round-label"></span>
      <span id="match-counter"></span>
    </div>

    <div id="champion-banner" class="champion-banner">
      <span id="champion-text"></span>
      <button id="restart-btn" class="btn-reset" type="button">Play Again</button>
    </div>

    <section id="arena" class="arena"></section>

    <section class="ranking-card">
      <h2 class="ranking-title">Elo Standings</h2>
      <div id="rank-list" class="rank-list"></div>
    </section>
  </div>

  <script>
    const DEMONS = [
      { id: "slh", name: "Slaughterhouse", creator: "Icedcave", verifier: "Doggie", song: "Lost", elo: 1200, img: "https://i.ytimg.com/vi/kxyyKU8uFvU/hqdefault.jpg" },
      { id: "ach", name: "Acheron", creator: "Ryamu", verifier: "Zoink", song: "Thermodynamix", elo: 1200, img: "https://i.ytimg.com/vi/sBKR6aUorzA/hqdefault.jpg" },
      { id: "tw", name: "Tidal Wave", creator: "OniLink", verifier: "Zoink", song: "Shiawase (VIP)", elo: 1200, img: "https://i.ytimg.com/vi/9fsZ014qB3s/hqdefault.jpg" },
      { id: "bb", name: "Bloodbath", creator: "Riot", verifier: "Riot", song: "At the Speed of Light", elo: 1200, img: "https://i.ytimg.com/vi/tw25C62X4_Y/hqdefault.jpg" },
      { id: "trt", name: "Tartarus", creator: "Dolphy", verifier: "Dolphy", song: "Golden Haze", elo: 1200, img: "https://i.ytimg.com/vi/tw25C62X4_Y/hqdefault.jpg" },
      { id: "fw", name: "Firework", creator: "Trick", verifier: "Trick", song: "Chokehold", elo: 1200, img: "https://i.ytimg.com/vi/sBKR6aUorzA/hqdefault.jpg" },
      { id: "lmb", name: "Limbo", creator: "MindCap", verifier: "Bgram", song: "Isolation", elo: 1200, img: "https://i.ytimg.com/vi/1y6z-aL6x9g/hqdefault.jpg" },
      { id: "ns", name: "Nullscapes", creator: "Kiba", verifier: "Zoink", song: "Flow", elo: 1200, img: "https://i.ytimg.com/vi/1y6z-aL6x9g/hqdefault.jpg" }
    ];

    let mode = "1v1";
    let pair = [null, null];
    let cupQueue = [];
    let nextRoundQueue = [];
    let cupRoundName = "Quarterfinals";
    let cupFinished = false;
    let votesCount = 0;

    const arenaEl = document.getElementById("arena");
    const roundLabelEl = document.getElementById("round-label");
    const matchCounterEl = document.getElementById("match-counter");
    const rankListEl = document.getElementById("rank-list");
    const championBannerEl = document.getElementById("champion-banner");
    const championTextEl = document.getElementById("champion-text");
    const restartBtn = document.getElementById("restart-btn");

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateElo(winner, loser) {
      const k = 32;
      const expectedWin = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
      winner.elo = Math.round(winner.elo + k * (1 - expectedWin));
      loser.elo = Math.round(loser.elo - k * expectedWin);
    }

    function renderStandings() {
      const sorted = [...DEMONS].sort((a, b) => b.elo - a.elo);
      rankListEl.innerHTML = sorted
        .map(
          (d, idx) => `
          <div class="rank-item">
            <span>#${idx + 1} ${d.name}</span>
            <span class="elo-tag">${d.elo} Elo</span>
          </div>`
        )
        .join("");
    }

    function pickRandomPair() {
      const shuffled = shuffle(DEMONS);
      pair = [shuffled[0], shuffled[1]];
    }

    function setupCup() {
      cupFinished = false;
      championBannerEl.classList.remove("show");
      cupQueue = shuffle(DEMONS);
      nextRoundQueue = [];
      cupRoundName = "Quarterfinals";
      advanceCupMatch();
    }

    function advanceCupMatch() {
      if (cupQueue.length < 2) {
        if (nextRoundQueue.length === 1) {
          const champ = nextRoundQueue[0];
          cupFinished = true;
          arenaEl.innerHTML = "";
          roundLabelEl.textContent = "Tournament Complete";
          championTextEl.textContent = `Bracket Champion: ${champ.name} (${champ.elo} Elo)`;
          championBannerEl.classList.add("show");
          return;
        }
        cupQueue = [...nextRoundQueue];
        nextRoundQueue = [];
        cupRoundName = cupQueue.length === 4 ? "Semifinals" : "Finals";
      }

      pair = [cupQueue.shift(), cupQueue.shift()];
      renderArena();
    }

    function renderArena() {
      championBannerEl.classList.remove("show");
      if (mode === "1v1") {
        roundLabelEl.textContent = "Mode: Endless 1v1 Showdown";
        matchCounterEl.textContent = `Votes cast: ${votesCount}`;
      } else {
        roundLabelEl.textContent = `Stage: ${cupRoundName}`;
        matchCounterEl.textContent = `Remaining in round: ${Math.ceil(cupQueue.length / 2) + 1}`;
      }

      arenaEl.innerHTML = `
        ${buildFighterCard(pair[0], 0)}
        <div class="vs-badge">VS</div>
        ${buildFighterCard(pair[1], 1)}
      `;

      arenaEl.querySelectorAll(".vote-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.idx);
          const winner = pair[idx];
          const loser = pair[idx === 0 ? 1 : 0];
          handleVote(winner, loser);
        });
      });
    }

    function buildFighterCard(demon, idx) {
      return `
        <article class="fighter-card">
          <img class="fighter-thumb" src="${demon.img}" alt="${demon.name}" />
          <div class="fighter-body">
            <h3 class="fighter-name">${demon.name}</h3>
            <div class="fighter-meta">
              <div>Creator: <strong>${demon.creator}</strong></div>
              <div>Verifier: <strong>${demon.verifier}</strong></div>
              <div>Song: <strong>${demon.song}</strong></div>
            </div>
            <button class="vote-btn" data-idx="${idx}" type="button">Vote ${demon.name}</button>
          </div>
        </article>
      `;
    }

    function handleVote(winner, loser) {
      votesCount++;
      updateElo(winner, loser);
      renderStandings();

      if (mode === "1v1") {
        pickRandomPair();
        renderArena();
      } else {
        nextRoundQueue.push(winner);
        advanceCupMatch();
      }
    }

    function startMode(newMode) {
      mode = newMode;
      document.getElementById("btn-1v1").classList.toggle("active", mode === "1v1");
      document.getElementById("btn-cup").classList.toggle("active", mode === "cup");

      if (mode === "1v1") {
        pickRandomPair();
        renderArena();
      } else {
        setupCup();
      }
    }

    document.getElementById("btn-1v1").addEventListener("click", () => startMode("1v1"));
    document.getElementById("btn-cup").addEventListener("click", () => startMode("cup"));
    restartBtn.addEventListener("click", setupCup);

    renderStandings();
    startMode("1v1");
  </script>
</body>
</html>
