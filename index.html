<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extreme Demon Tournament — 1v1 Showdowns</title>
  <style>
    :root {
      --bg: #080a10;
      --panel: #101522;
      --panel-2: #171e30;
      --line: rgba(148, 163, 184, 0.14);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --win: #22c55e;
      --danger: #ef4444;
      --gold: #eab308;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.15), transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .title {
      margin: 0;
      font-size: 22px;
      font-weight: 850;
      user-select: none;
      cursor: pointer;
    }

    .subtitle {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .admin-badge {
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(234, 179, 8, 0.14);
      border: 1px solid rgba(234, 179, 8, 0.45);
      color: var(--gold);
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .admin-badge.active {
      display: inline-flex;
    }

    .mode-switch {
      display: flex;
      background: var(--panel);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--line);
      gap: 4px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #061018;
    }

    .admin-panel {
      display: none;
      background: var(--panel);
      border: 1px solid rgba(234, 179, 8, 0.35);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 20px;
    }

    .admin-panel.active {
      display: block;
    }

    .admin-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .admin-title {
      margin: 0;
      font-size: 15px;
      font-weight: 850;
      color: var(--gold);
    }

    .btn-add {
      background: var(--win);
      color: #051309;
      border: none;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-exit-admin {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .managed-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 8px;
    }

    .managed-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
    }

    .btn-remove {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .round-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    @media (max-width: 720px) {
      .arena {
        grid-template-columns: 1fr;
      }
      .vs-badge {
        text-align: center;
      }
    }

    .vs-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      color: var(--accent);
      padding: 6px;
    }

    .fighter-card {
      background: var(--panel);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }

    .fighter-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .fighter-thumb {
      width: 100%;
      height: 165px;
      object-fit: cover;
      background: #05070c;
    }

    .fighter-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .fighter-name {
      margin: 0;
      font-size: 19px;
      font-weight: 850;
    }

    .fighter-meta {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .vote-btn {
      margin-top: auto;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #0284c7);
      color: #051018;
      font-weight: 850;
      font-size: 14px;
      cursor: pointer;
    }

    .champion-banner {
      display: none;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.45);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 22px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .champion-banner.show {
      display: flex;
    }

    .btn-reset {
      background: var(--win);
      color: #051309;
      border: none;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .ranking-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
    }

    .ranking-title {
      margin: 0 0 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .rank-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 8px;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .elo-tag {
      color: var(--gold);
      font-size: 12px;
    }

    .notice-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
    }

    /* Modals */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 12, 0.78);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-title {
      margin: 0;
      font-size: 17px;
      font-weight: 850;
    }

    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
    }

    .aredl-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .aredl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .aredl-info {
      font-size: 13px;
    }

    .aredl-sub {
      font-size: 11.5px;
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #061018;
      border: none;
      border-radius: 9px;
      padding: 8px 14px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1 id="page-title" class="title" title="Triple click for admin login">Extreme Demon Tournament</h1>
        <p class="subtitle">1v1 matchups &amp; tournament bracket</p>
      </div>

      <div class="header-actions">
        <div id="admin-badge" class="admin-badge">
          <span>ADMIN MODE</span>
          <button id="exit-admin-btn" class="btn-exit-admin" type="button">Lock</button>
        </div>

        <div class="mode-switch">
          <button id="btn-1v1" class="mode-btn active" type="button">1v1 Elo</button>
          <button id="btn-cup" class="mode-btn" type="button">Bracket Cup</button>
        </div>
      </div>
    </header>

    <section id="admin-panel" class="admin-panel">
      <div class="admin-top">
        <h2 class="admin-title">Admin Level Manager (AREDL)</h2>
        <button id="open-aredl-btn" class="btn-add" type="button">+ Add Level from AREDL</button>
      </div>
      <div id="managed-list" class="managed-list"></div>
    </section>

    <div class="round-bar">
      <span id="round-label"></span>
      <span id="match-counter"></span>
    </div>

    <div id="champion-banner" class="champion-banner">
      <span id="champion-text"></span>
      <button id="restart-btn" class="btn-reset" type="button">Play Again</button>
    </div>

    <section id="arena" class="arena"></section>

    <section class="ranking-card">
      <h2 class="ranking-title">Elo Standings</h2>
      <div id="rank-list" class="rank-list"></div>
    </section>
  </div>

  <!-- Password Modal -->
  <div id="password-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <h2 class="modal-title">Admin Authentication</h2>
      <label for="password-input" class="aredl-sub">Enter admin password (case-sensitive):</label>
      <input id="password-input" class="modal-input" type="password" autocomplete="off" placeholder="Password" />
      <div class="modal-actions">
        <button id="cancel-password-btn" class="btn-secondary" type="button">Cancel</button>
        <button id="submit-password-btn" class="btn-primary" type="button">Unlock</button>
      </div>
    </div>
  </div>

  <!-- AREDL Picker Modal -->
  <div id="aredl-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card">
      <h2 class="modal-title">Select Level from AREDL</h2>
      <input id="aredl-search" class="modal-input" type="text" placeholder="Search demon, creator, or verifier..." />
      <div id="aredl-status" class="aredl-sub">Loading AREDL levels...</div>
      <div id="aredl-list" class="aredl-list"></div>
      <div class="modal-actions">
        <button id="close-aredl-btn" class="btn-secondary" type="button">Close</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "6767XDXD";
    const STORAGE_KEY = "extreme_demon_tournament_levels_v1";
    const AREDL_ENDPOINTS = [
      "https://aredl.net/api/aredl/levels",
      "https://aredl.net/api/v1/levels"
    ];

    const FALLBACK_AREDL_CATALOG = [
      { id: "slh", name: "Slaughterhouse", creator: "Icedcave", verifier: "Doggie", song: "Lost", elo: 1200, img: "https://i.ytimg.com/vi/kxyyKU8uFvU/hqdefault.jpg" },
      { id: "ach", name: "Acheron", creator: "Ryamu", verifier: "Zoink", song: "Thermodynamix", elo: 1200, img: "https://i.ytimg.com/vi/sBKR6aUorzA/hqdefault.jpg" },
      { id: "tw", name: "Tidal Wave", creator: "OniLink", verifier: "Zoink", song: "Shiawase (VIP)", elo: 1200, img: "https://i.ytimg.com/vi/9fsZ014qB3s/hqdefault.jpg" },
      { id: "bb", name: "Bloodbath", creator: "Riot", verifier: "Riot", song: "At the Speed of Light", elo: 1200, img: "https://i.ytimg.com/vi/tw25C62X4_Y/hqdefault.jpg" },
      { id: "trt", name: "Tartarus", creator: "Dolphy", verifier: "Dolphy", song: "Golden Haze", elo: 1200, img: "https://i.ytimg.com/vi/tw25C62X4_Y/hqdefault.jpg" },
      { id: "fw", name: "Firework", creator: "Trick", verifier: "Trick", song: "Chokehold", elo: 1200, img: "https://i.ytimg.com/vi/sBKR6aUorzA/hqdefault.jpg" },
      { id: "lmb", name: "Limbo", creator: "MindCap", verifier: "Bgram", song: "Isolation", elo: 1200, img: "https://i.ytimg.com/vi/1y6z-aL6x9g/hqdefault.jpg" },
      { id: "ns", name: "Nullscapes", creator: "Kiba", verifier: "Zoink", song: "Flow", elo: 1200, img: "https://i.ytimg.com/vi/1y6z-aL6x9g/hqdefault.jpg" },
      { id: "anathema", name: "Anathema", creator: "Whizkid05", verifier: "Whizkid05", song: "Dimension", elo: 1200, img: "https://i.ytimg.com/vi/kxyyKU8uFvU/hqdefault.jpg" },
      { id: "ts2", name: "Thinking Space II", creator: "CairoX", verifier: "Zoink", song: "Freakshow", elo: 1200, img: "https://i.ytimg.com/vi/9fsZ014qB3s/hqdefault.jpg" }
    ];

    let demons = loadSavedDemons();
    let aredlCatalog = [...FALLBACK_AREDL_CATALOG];
    let isAdmin = false;
    let titleClickCount = 0;
    let titleClickTimer = null;

    let mode = "1v1";
    let pair = [null, null];
    let cupQueue = [];
    let nextRoundQueue = [];
    let cupRoundName = "Quarterfinals";
    let cupFinished = false;
    let votesCount = 0;

    const pageTitleEl = document.getElementById("page-title");
    const adminBadgeEl = document.getElementById("admin-badge");
    const adminPanelEl = document.getElementById("admin-panel");
    const managedListEl = document.getElementById("managed-list");
    const arenaEl = document.getElementById("arena");
    const roundLabelEl = document.getElementById("round-label");
    const matchCounterEl = document.getElementById("match-counter");
    const rankListEl = document.getElementById("rank-list");
    const championBannerEl = document.getElementById("champion-banner");
    const championTextEl = document.getElementById("champion-text");
    const restartBtn = document.getElementById("restart-btn");

    const passwordModalEl = document.getElementById("password-modal");
    const passwordInputEl = document.getElementById("password-input");
    const aredlModalEl = document.getElementById("aredl-modal");
    const aredlSearchEl = document.getElementById("aredl-search");
    const aredlStatusEl = document.getElementById("aredl-status");
    const aredlListEl = document.getElementById("aredl-list");

    function loadSavedDemons() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed;
        }
      } catch (_) {}
      return FALLBACK_AREDL_CATALOG.slice(0, 8).map((d) => ({ ...d }));
    }

    function saveDemons() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(demons));
      } catch (_) {}
    }

    function normalizeAredlItem(item, index) {
      const name = item.name || item.level_name || item.title || `Demon ${index + 1}`;
      const creator =
        item.creator ||
        item.publisher ||
        (Array.isArray(item.creators) ? item.creators.map((c) => c.name || c).join(", ") : "Unknown");
      const verifier =
        item.verifier ||
        (Array.isArray(item.verifiers) ? item.verifiers.map((v) => v.name || v).join(", ") : "Unknown");
      const song = item.song || item.song_name || item.music || "Newgrounds / NCS";
      const ytId = item.video_id || item.youtube_id || "";
      const img = item.thumbnail || (ytId ? `https://i.ytimg.com/vi/${ytId}/hqdefault.jpg` : "https://i.ytimg.com/vi/kxyyKU8uFvU/hqdefault.jpg");
      const slugId = String(item.id || name)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "") || `level-${index}`;

      return {
        id: slugId,
        name,
        creator,
        verifier,
        song,
        elo: 1200,
        img
      };
    }

    async function fetchAredlCatalog() {
      for (const url of AREDL_ENDPOINTS) {
        try {
          const res = await fetch(url, { headers: { Accept: "application/json" } });
          if (!res.ok) continue;
          const data = await res.json();
          const list = Array.isArray(data) ? data : (data.levels || data.data || []);
          if (Array.isArray(list) && list.length > 0) {
            aredlCatalog = list.map(normalizeAredlItem);
            aredlStatusEl.textContent = `Loaded ${aredlCatalog.length} levels from AREDL API.`;
            renderAredlOptions();
            return;
          }
        } catch (_) {}
      }
      aredlStatusEl.textContent = "Showing built-in AREDL list (live API unreachable or blocked by browser).";
      renderAredlOptions();
    }

    function renderAredlOptions() {
      const query = aredlSearchEl.value.trim().toLowerCase();
      const addedIds = new Set(demons.map((d) => d.id));

      const filtered = aredlCatalog.filter((item) => {
        if (!query) return true;
        return (
          item.name.toLowerCase().includes(query) ||
          item.creator.toLowerCase().includes(query) ||
          item.verifier.toLowerCase().includes(query)
        );
      });

      aredlListEl.innerHTML = filtered
        .slice(0, 80)
        .map((item) => {
          const alreadyAdded = addedIds.has(item.id);
          return `
            <div class="aredl-row">
              <div class="aredl-info">
                <div><strong>${item.name}</strong></div>
                <div class="aredl-sub">Creator: ${item.creator} • Verifier: ${item.verifier}</div>
              </div>
              <button
                class="btn-primary"
                type="button"
                data-add-id="${item.id}"
                ${alreadyAdded ? "disabled" : ""}
              >
                ${alreadyAdded ? "Added" : "Add"}
              </button>
            </div>
          `;
        })
        .join("");

      aredlListEl.querySelectorAll("[data-add-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const chosen = aredlCatalog.find((d) => d.id === btn.dataset.addId);
          if (!chosen) return;
          demons.push({ ...chosen, elo: 1200 });
          saveDemons();
          renderAredlOptions();
          refreshAllViews();
        });
      });
    }

    function removeLevel(id) {
      demons = demons.filter((d) => d.id !== id);
      saveDemons();
      refreshAllViews();
    }

    function renderManagedList() {
      if (!isAdmin) return;
      if (demons.length === 0) {
        managedListEl.innerHTML = `<div class="aredl-sub">No levels added yet. Click "+ Add Level from AREDL".</div>`;
        return;
      }
      managedListEl.innerHTML = demons
        .map(
          (d) => `
          <div class="managed-item">
            <span>${d.name}</span>
            <button class="btn-remove" type="button" data-remove-id="${d.id}">Remove</button>
          </div>
        `
        )
        .join("");

      managedListEl.querySelectorAll("[data-remove-id]").forEach((btn) => {
        btn.addEventListener("click", () => removeLevel(btn.dataset.removeId));
      });
    }

    function setAdminState(active) {
      isAdmin = active;
      adminBadgeEl.classList.toggle("active", isAdmin);
      adminPanelEl.classList.toggle("active", isAdmin);
      renderManagedList();
    }

    pageTitleEl.addEventListener("click", () => {
      titleClickCount++;
      clearTimeout(titleClickTimer);
      titleClickTimer = setTimeout(() => {
        titleClickCount = 0;
      }, 650);

      if (titleClickCount >= 3) {
        titleClickCount = 0;
        clearTimeout(titleClickTimer);
        passwordInputEl.value = "";
        passwordModalEl.classList.add("open");
        passwordInputEl.focus();
      }
    });

    document.getElementById("cancel-password-btn").addEventListener("click", () => {
      passwordModalEl.classList.remove("open");
    });

    document.getElementById("submit-password-btn").addEventListener("click", () => {
      if (passwordInputEl.value === ADMIN_PASSWORD) {
        passwordModalEl.classList.remove("open");
        setAdminState(true);
      } else {
        passwordInputEl.value = "";
        passwordInputEl.placeholder = "Incorrect password";
      }
    });

    passwordInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        document.getElementById("submit-password-btn").click();
      }
    });

    document.getElementById("exit-admin-btn").addEventListener("click", () => {
      setAdminState(false);
    });

    document.getElementById("open-aredl-btn").addEventListener("click", () => {
      aredlModalEl.classList.add("open");
      fetchAredlCatalog();
    });

    document.getElementById("close-aredl-btn").addEventListener("click", () => {
      aredlModalEl.classList.remove("open");
    });

    aredlSearchEl.addEventListener("input", renderAredlOptions);

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateElo(winner, loser) {
      const k = 32;
      const expectedWin = 1 / (1 + Math.pow(10, (loser.elo - winner.elo) / 400));
      winner.elo = Math.round(winner.elo + k * (1 - expectedWin));
      loser.elo = Math.round(loser.elo - k * expectedWin);
      saveDemons();
    }

    function renderStandings() {
      const sorted = [...demons].sort((a, b) => b.elo - a.elo);
      if (sorted.length === 0) {
        rankListEl.innerHTML = `<div class="aredl-sub">No levels in standings.</div>`;
        return;
      }
      rankListEl.innerHTML = sorted
        .map(
          (d, idx) => `
          <div class="rank-item">
            <span>#${idx + 1} ${d.name}</span>
            <span class="elo-tag">${d.elo} Elo</span>
          </div>`
        )
        .join("");
    }

    function pickRandomPair() {
      if (demons.length < 2) {
        pair = [null, null];
        return;
      }
      const shuffled = shuffle(demons);
      pair = [shuffled[0], shuffled[1]];
    }

    function setupCup() {
      cupFinished = false;
      championBannerEl.classList.remove("show");
      if (demons.length < 2) {
        arenaEl.innerHTML = `<div class="notice-box" style="grid-column: 1 / -1;">Add at least 2 levels in Admin Mode to start a bracket.</div>`;
        roundLabelEl.textContent = "Bracket Cup";
        matchCounterEl.textContent = "";
        return;
      }
      cupQueue = shuffle(demons);
      nextRoundQueue = [];
      cupRoundName = cupQueue.length > 4 ? `Round of ${cupQueue.length}` : cupQueue.length === 4 ? "Semifinals" : "Finals";
      advanceCupMatch();
    }

    function advanceCupMatch() {
      if (cupQueue.length === 1 && nextRoundQueue.length === 0) {
        const champ = cupQueue[0];
        cupFinished = true;
        arenaEl.innerHTML = "";
        roundLabelEl.textContent = "Tournament Complete";
        matchCounterEl.textContent = "";
        championTextEl.textContent = `Tournament Champion: ${champ.name} (${champ.elo} Elo)`;
        championBannerEl.classList.add("show");
        return;
      }

      if (cupQueue.length < 2) {
        if (cupQueue.length === 1) {
          nextRoundQueue.push(cupQueue.shift());
        }
        if (nextRoundQueue.length === 1) {
          const champ = nextRoundQueue[0];
          cupFinished = true;
          arenaEl.innerHTML = "";
          roundLabelEl.textContent = "Tournament Complete";
          matchCounterEl.textContent = "";
          championTextEl.textContent = `Tournament Champion: ${champ.name} (${champ.elo} Elo)`;
          championBannerEl.classList.add("show");
          return;
        }
        cupQueue = [...nextRoundQueue];
        nextRoundQueue = [];
        cupRoundName = cupQueue.length === 4 ? "Semifinals" : cupQueue.length === 2 ? "Finals" : `Round of ${cupQueue.length}`;
      }

      pair = [cupQueue.shift(), cupQueue.shift()];
      renderArena();
    }

    function renderArena() {
      championBannerEl.classList.remove("show");
      if (demons.length < 2 || !pair[0] || !pair[1]) {
        arenaEl.innerHTML = `<div class="notice-box" style="grid-column: 1 / -1;">Add at least 2 levels in Admin Mode to play matchups.</div>`;
        roundLabelEl.textContent = mode === "1v1" ? "Mode: 1v1 Showdown" : "Bracket Cup";
        matchCounterEl.textContent = `Levels active: ${demons.length}`;
        return;
      }

      if (mode === "1v1") {
        roundLabelEl.textContent = "Mode: Endless 1v1 Showdown";
        matchCounterEl.textContent = `Votes cast: ${votesCount}`;
      } else {
        roundLabelEl.textContent = `Stage: ${cupRoundName}`;
        matchCounterEl.textContent = `Remaining in round: ${Math.ceil(cupQueue.length / 2) + 1}`;
      }

      arenaEl.innerHTML = `
        ${buildFighterCard(pair[0], 0)}
        <div class="vs-badge">VS</div>
        ${buildFighterCard(pair[1], 1)}
      `;

      arenaEl.querySelectorAll(".vote-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.idx);
          const winner = pair[idx];
          const loser = pair[idx === 0 ? 1 : 0];
          handleVote(winner, loser);
        });
      });
    }

    function buildFighterCard(demon, idx) {
      return `
        <article class="fighter-card">
          <img class="fighter-thumb" src="${demon.img}" alt="${demon.name}" />
          <div class="fighter-body">
            <h3 class="fighter-name">${demon.name}</h3>
            <div class="fighter-meta">
              <div>Creator: <strong>${demon.creator}</strong></div>
              <div>Verifier: <strong>${demon.verifier}</strong></div>
              <div>Song: <strong>${demon.song}</strong></div>
            </div>
            <button class="vote-btn" data-idx="${idx}" type="button">Vote ${demon.name}</button>
          </div>
        </article>
      `;
    }

    function handleVote(winner, loser) {
      votesCount++;
      updateElo(winner, loser);
      renderStandings();

      if (mode === "1v1") {
        pickRandomPair();
        renderArena();
      } else {
        nextRoundQueue.push(winner);
        advanceCupMatch();
      }
    }

    function startMode(newMode) {
      mode = newMode;
      document.getElementById("btn-1v1").classList.toggle("active", mode === "1v1");
      document.getElementById("btn-cup").classList.toggle("active", mode === "cup");

      if (mode === "1v1") {
        pickRandomPair();
        renderArena();
      } else {
        setupCup();
      }
    }

    function refreshAllViews() {
      renderManagedList();
      renderStandings();
      if (mode === "1v1") {
        pickRandomPair();
        renderArena();
      } else {
        setupCup();
      }
    }

    document.getElementById("btn-1v1").addEventListener("click", () => startMode("1v1"));
    document.getElementById("btn-cup").addEventListener("click", () => startMode("cup"));
    restartBtn.addEventListener("click", setupCup);

    renderStandings();
    startMode("1v1");
  </script>
</body>
</html>
